<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopNest - Login / Register</title>
  <link rel="stylesheet" href="assets/css/global.css">
  <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body class="auth-body">

  <div class="auth-container">
    <div class="auth-tabs">
      <button class="tab-btn active" id="login-tab">Login</button>
      <button class="tab-btn" id="register-tab">Register</button>
    </div>

    <!-- Login Form -->
    <form id="login-form" class="auth-form">
      <h2>Welcome Back</h2>
      <div class="form-group">
        <label for="login-email">Email Address</label>
        <input type="email" id="login-email" required placeholder="student@ university.edu">
      </div>
      <div class="form-group">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn-primary">Login</button>
    </form>

    <!-- Register Form (Hidden by default) -->
    <form id="register-form" class="auth-form hidden">
      <h2>Create Account</h2>
      <div class="form-group">
        <label for="reg-name">Full Name</label>
        <input type="text" id="reg-name" required placeholder="John Doe">
      </div>
      <div class="form-group">
        <label for="reg-email">Email Address</label>
        <input type="email" id="reg-email" required placeholder="student@university.edu">
      </div>
      <div class="form-group">
        <label for="reg-password">Password</label>
        <input type="password" id="reg-password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn-primary">Register</button>
    </form>
  </div>

  <script src="assets/js/auth.js"></script>
</body>
</html>
